# Transcribed from the original manuscript, not reconstructed training logs.
# This record preserves the reported setup; it is not a runnable Trainer config.
record_type: original_manuscript_reported_settings
results_scope: original_experiments_before_interpolation_correction
detector_family: YOLOv8
exact_variant: null
initial_checkpoint_sha256: null
trained_checkpoint_sha256: null
deployment_engine_sha256: null
training:
  epochs: 300
  reported_global_batch_size: 64
  reported_devices: 4
  reported_batch_per_device: 16
  input_size: [640, 640]
  independent_seed_runs: 10
optimizer:
  type: AdamW
  learning_rate: 0.001
  weight_decay: 0.05
  betas: [0.9, 0.999]
  gradient_clip_norm: 1.0
learning_rate_schedule:
  type: cosine
  warmup_epochs: 5
  warmup_learning_rate: 0.00001
  minimum_learning_rate: 0.000001
precision_schedule:
  mode: legacy_multiply
  warmup_epochs: 20
  transition_endpoint: 50
  initial_temperature: 10.0
  multiplier: '1 + 9 * exp(-5 * epoch / 300)'
  training_bits: 'clip(multiplier * base_bits, 2, 8)'
  post_warmup_target: '4 + 4 * exp(-3 * (epoch - 20) / 280)'
  inference_multiplier: 1.0
  target_asymptote: 4.0
sample_admission:
  initial_threshold: 0.2
  threshold_reaches_one_at_epoch: 20
loss_weights:
  bit_budget: '0.01 + 0.09 * epoch / 300'
  smoothness: 0.1
  distillation: 0.5
  mapping_regularization: 0.0001
quantization:
  activation_bit_range: [2, 8]
  grid_per_level: [8, 8]
  calibration_images: 1000
  ema_momentum: 0.99
  reported_weight_bits: 4
  mapping_hidden_dimensions: [32, 64, 32]
augmentation:
  mosaic_probability: 0.5
  mixup_probability: 0.1
  hsv: [0.015, 0.7, 0.4]
  horizontal_flip_probability: 0.5
deployment_measurements:
  gpu: NVIDIA RTX PRO 6000 Blackwell
  cse_precomputed_fps: 151
  cse_online_fps_approximate: 127
  coco_online_fps: 158
  voc_online_fps: 163
  coco_voc_mode_source: author_confirmation_2026_10_12
  cse_precomputed_energy_j_per_image: 0.14
class_summary_provenance:
  reported_ap_drop: {person: 17.2, helmet: 5.3}
  ap_drop_reference_precision_pair: null
  ap_drop_relative_percent_or_percentage_points: null
  descriptor_extraction_space: null
  descriptor_extraction_size: null
  descriptor_backend: null
  descriptor_aggregation: null
  provenance_status: author_could_not_recall_extraction_protocol_2026_10_12
